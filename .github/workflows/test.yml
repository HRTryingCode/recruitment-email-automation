name: tests

on:
  pull_request:
    branches: [main, "claude/**"]
  push:
    branches: [main, "claude/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate --workspace=backend
      - name: Validate Prisma schema
        # Dummy DB URLs — `prisma validate` and `migrate diff` parse the
        # schema only; they don't connect. They just need the env vars
        # referenced in the datasource block to resolve.
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: cd backend && npx prisma validate
      - name: Check schema/migration consistency
        # Fails the build if schema.prisma drifts from the applied migrations.
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: cd backend && npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Type-check backend (src + tests)
        run: npm run typecheck --workspace=backend
      - name: Run backend tests
        run: npm test --workspace=backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build frontend (type-check + bundle)
        run: cd frontend && npm run build
      - name: Run frontend tests
        run: cd frontend && npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: cd e2e && npx playwright install chromium --with-deps
      - run: cd e2e && npm test
