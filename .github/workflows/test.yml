name: tests

on:
  pull_request:
    branches: [main, "claude/**"]
  push:
    branches: [main, "claude/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Ephemeral Postgres used as the shadow DB for `prisma migrate diff`.
    # `validate` is parse-only and doesn't need a real connection, but
    # `migrate diff --from-migrations` does because it applies migrations
    # to derive the schema state.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Create shadow database
        # Prisma's `migrate diff --from-migrations` needs an empty DB to
        # replay the migrations against. The service container creates
        # `ci`; we add `ci_shadow` ourselves.
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d postgres -c "CREATE DATABASE ci_shadow;"
      - name: Generate Prisma client
        run: npm run db:generate --workspace=backend
      - name: Validate Prisma schema
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: cd backend && npx prisma validate
      - name: Check schema/migration consistency
        # Fails the build if schema.prisma drifts from the applied migrations.
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: |
          cd backend && npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://ci:ci@localhost:5432/ci_shadow \
            --exit-code
      - name: Type-check backend (src + tests)
        run: npm run typecheck --workspace=backend
      - name: Run backend tests (with coverage floor)
        run: npm run test:coverage --workspace=backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build frontend (type-check + bundle)
        run: cd frontend && npm run build
      - name: Run frontend tests (with coverage floor)
        run: cd frontend && npm run test:coverage
      # Report-only until R1–R4 land (docs/DESIGN-SYSTEM.md): prints the
      # hand-rolled-UI baseline per batch; warnings never fail the job.
      - name: Design-system baseline (report-only)
        run: cd frontend && npm run audit:ds && npm run lint:ds -- --format stylish | tail -1

  # End-to-end smoke tests against THIS commit, not prod (audit M31).
  # Playwright boots the backend (tsx) and `vite preview` of the built SPA
  # itself (see e2e/playwright.config.ts) against a throwaway Postgres.
  # Every secret below is a CI-only dummy; nothing here talks to Gmail,
  # Anthropic, Supabase or Vercel.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci?schema=public
      NODE_ENV: test
      PORT: '3001'
      ALLOWED_ORIGINS: http://localhost:4173
      FRONTEND_URL: http://localhost:4173
      # Shape-valid fake so /api/health reports "healthy"; never called.
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-key-not-a-real-credential-000000
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      # 32 zero bytes, base64 — CI-only.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: ci-only-cron-secret
      GMAIL_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      GMAIL_CLIENT_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply migrations to the CI database
        run: cd backend && npx prisma migrate deploy
      - name: Build frontend
        run: cd frontend && npm run build
      - run: cd e2e && npx playwright install chromium --with-deps
      - name: Run e2e against the local stack
        run: cd e2e && npm test
